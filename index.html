<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT TAR SP7 - FINAL TASK</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #ffffff;
        }
        
        h1 { 
            margin-bottom: 5px; 
            color: #FFCC00; 
            text-shadow: 2px 2px 0px #000;
            font-family: 'Arial Black', Impact, sans-serif;
        }
        p.subtitle { color: #aaaaaa; margin-top: 0; margin-bottom: 20px; }
        
        #progress {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #FFCC00;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #FFCC00;
        }

        /* 4x4 的網格佈局 */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px;
            max-width: 380px; 
            margin: 0 auto;
        }

        .card {
            aspect-ratio: 1; 
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face-down, .card-face-up {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-radius: 4px; 
            overflow: hidden; 
        }

        /* 👑 TAR 經典 Clue 牌背設計 👑 */
        .card-face-down {
            background-color: #FFCC00; 
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tar-black-banner {
            background-color: #000000;
            width: 100%;
            height: 48%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 0 4px;
            box-sizing: border-box;
            overflow: hidden; /* 加上保險：防止文字破框溢出 */
        }

        /* THE AMAZING (白色) - 縮小字體上限與字距，完美塞入方塊 */
        .tar-line1 {
            color: #ffffff;
            font-family: 'Arial Black', Impact, sans-serif;
            font-weight: 900;
            font-size: clamp(6px, 1.6vw, 9.5px); 
            letter-spacing: 0.5px; 
            line-height: 1.2;
            margin-bottom: 2px; 
            white-space: nowrap; 
            width: 100%;
            text-align: center;
        }

        /* RACE (黃色) - 微調字體與字距 */
        .tar-line2 {
            color: #FFCC00;
            font-family: 'Arial Black', Impact, sans-serif;
            font-weight: 900;
            font-size: clamp(10px, 2.8vw, 15px); 
            letter-spacing: 2px; 
            line-height: 1.1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5); 
            white-space: nowrap; 
            width: 100%;
            text-align: center;
        }

        .card-face-up {
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 3px solid #FFCC00; 
            font-size: 2rem;
            box-sizing: border-box;
        }

        /* 彈出視窗設定 */
        #win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #1a1a1a;
            border: 3px solid #FFCC00;
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            max-height: 90vh; 
            overflow-y: auto; 
            box-sizing: border-box;
        }

        .modal-content h2 {
            color: #FFCC00;
            font-family: 'Arial Black', sans-serif;
            margin-top: 0;
        }

        .modal-content img {
            max-width: 100%;
            width: 200px;
            height: auto;
            margin-top: 20px;
            border: 5px solid white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- 🎵 音樂播放器隱藏區塊 🎵 -->
    <audio id="bgm" src="這裡貼上你的遊戲中背景音樂網址.mp3" loop></audio>
    <audio id="win-music" src="這裡貼上你的破關音樂網址.mp3"></audio>

    <h1>PTT TAR SP7</h1>
    <p class="subtitle">FINAL TASK：來回憶配對這趟旅程吧</p>
    <div id="progress">目前解鎖進度: 0 / 8</div>
    
    <div class="board" id="game-board"></div>

    <div id="win-modal">
        <div class="modal-content">
            <h2>🏆 任務完成！</h2>
            <p style="line-height: 1.6;">你已成功還原所有旅行記憶，<br>請掃描下方 QR Code 前往 FINISH LINE：</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=FinalDestinationClue" alt="QR Code">
        </div>
    </div>

    <script>
        // 8 組有順序的關聯卡片 (共 16 張)
        const targetPairs = [
            { pair: 1, content: "✈️" }, { pair: 1, content: "<img src='https://i.meee.com.tw/NXDCm84.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" },
            { pair: 2, content: "🚗" }, { pair: 2, content: "<img src='https://i.meee.com.tw/XWcF7UN.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" },
            { pair: 3, content: "<img src='https://i.meee.com.tw/ZvvVbdg.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" }, { pair: 3, content: "🍻" },
            { pair: 4, content: "<img src='https://i.meee.com.tw/C4MtWw0.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" }, { pair: 4, content: "🍁" },
            { pair: 5, content: "<img src='https://i.meee.com.tw/UnhlfOD.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" }, { pair: 5, content: "👘" },
            { pair: 6, content: "<img src='https://i.meee.com.tw/defoauY.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" }, { pair: 6, content: "🌅" },
            { pair: 7, content: "🍰" }, { pair: 7, content: "<img src='https://i.meee.com.tw/f8x6lq4.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" },
            { pair: 8, content: "<img src='https://i.meee.com.tw/rnvUdwK.jpg' style='width:100%; height:100%; border-radius:10px; object-fit:cover;'>" }, { pair: 8, content: "❤️" } 
        ];

        let allCards = [...targetPairs];
        
        let currentStep = 1;      
        let flippedCards = [];    
        let isLocked = false;     
        let bgmStarted = false; 

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            shuffle(allCards);
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            allCards.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.pair = cardData.pair; 
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face-down">
                            <div class="tar-black-banner">
                                <div class="tar-line1">THE AMAZING</div>
                                <div class="tar-line2">RACE</div>
                            </div>
                        </div>
                        <div class="card-face-up">${cardData.content}</div>
                    </div>
                `;

                cardEl.addEventListener('click', onCardClick);
                board.appendChild(cardEl);
            });
            
            updateProgress(); 
        }

        function onCardClick() {
            if (!bgmStarted) {
                const bgm = document.getElementById('bgm');
                if(bgm.getAttribute('src') !== "這裡貼上你的遊戲中背景音樂網址.mp3") {
                    bgm.play().catch(e => console.log("等待互動才能播放音效"));
                }
                bgmStarted = true;
            }

            if (isLocked || this.classList.contains('flipped')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                isLocked = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];
            
            const pair1 = parseInt(card1.dataset.pair);
            const pair2 = parseInt(card2.dataset.pair);

            if (pair1 === currentStep && pair2 === currentStep) {
                currentStep++;        
                flippedCards = [];    
                isLocked = false;     
                updateProgress();

                if (currentStep > 8) {
                    setTimeout(() => {
                        const bgm = document.getElementById('bgm');
                        const winMusic = document.getElementById('win-music');
                        bgm.pause(); 
                        
                        if(winMusic.getAttribute('src') !== "這裡貼上你的破關音樂網址.mp3") {
                            winMusic.play(); 
                        }

                        document.getElementById('win-modal').style.display = 'flex'; 
                    }, 500);
                }
            } else {
                setTimeout(() => {
                    const allFlipped = document.querySelectorAll('.card.flipped');
                    allFlipped.forEach(card => card.classList.remove('flipped')); 
                    
                    currentStep = 1;
                    flippedCards = [];
                    updateProgress();
                    isLocked = false; 
                }, 1200);
            }
        }

        function updateProgress() {
            const displayStep = currentStep > 8 ? 8 : currentStep - 1;
            document.getElementById('progress').innerText = `目前解鎖進度: ${displayStep} / 8`;
        }

        initGame();
    </script>
</body>
</html>
